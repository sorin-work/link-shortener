name: link-shortener

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:4415}
      COUNTRY_HEADER: ${COUNTRY_HEADER:-cf-ipcountry}
      # Creates demo@example.com / demo-password with sample links and clicks.
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - data:/data
    ports:
      - '${WEB_PORT:-4415}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  data:
